global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "distributed-scheduler-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: "distributed-scheduler-workers"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker-1:9090"
          - "worker-2:9090"
          - "worker-3:9090"
        labels:
          service: "worker"
